
# Cargar credenciales (no versionado)
spring.config.import=classpath:config/private.properties,classpath:eve-common-defaults.properties
spring.application.name=app-eve-ms-users
# DataSource
spring.datasource.url=${db.url}
spring.datasource.username=${db.username}
spring.datasource.password=${db.password}

# Swagger
springdoc.api-docs.enabled=true

# JWT (el secreto va en private.properties)
jwt.algorithm=HS256
jwt.issuer=app-eve-auth
jwt.claim.roles=roles

# JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

server.port=8082

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# Registrar usando IP en lugar del hostname
eureka.instance.prefer-ip-address=true

#Cache
spring.cache.type=redis
spring.data.redis.host=localhost
spring.data.redis.port=6379
logging.level.root=DEBUG
logging.level.org.springframework.cache = DEBUG
logging.level.org.springframework.cache.interceptor = DEBUG

cache.users.ttl-days=1